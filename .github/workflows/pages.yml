name: Pages

# Builds the site from the Markdown under entries/ and deploys it.
#
# Nothing generated is committed: generate.py writes _site/ on every push and
# the artifact goes straight to Pages, so the Markdown an agent reads stays the
# only source in the repository.

on:
  push:
    branches: [main]
    paths:
      - 'entries/**'
      - 'INDEX.md'
      - 'CONVENTIONS.md'
      - 'generate.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run queued behind another is superseded by a newer
# one, but a deployment already in flight is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Standard library only — no install step, and nothing to pin.
      - name: Build the site
        run: python3 generate.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
